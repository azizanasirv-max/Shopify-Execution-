name = "lbv-sales-copilot"
main = "worker.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "dist"

[vars]
NODE_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "lbv-sales-sessions"
database_id = "00000000-0000-0000-0000-000000000000" # REPLACE with your real D1 database ID before deploying
migrations_dir = "migrations"

