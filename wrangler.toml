name = "lbv-sales-copilot"
main = "worker.ts"
# Raised from 2024-03-20 to a date that supports modern Workers Static Assets
# and the current nodejs_compat behavior. See DEPLOYMENT.md.
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Static frontend assets
#
# Vite builds the SPA into ./dist. The Worker is invoked only for requests that
# do NOT match an asset (so /api/* always reaches worker.ts), and non-asset
# navigation is handled by not_found_handling = "single-page-application".
# The built assets are exposed to the Worker through the ASSETS binding, which
# worker.ts delegates to via env.ASSETS.fetch().
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NODE_ENV = "production"

# ---------------------------------------------------------------------------
# Scheduled session cleanup (hourly). Invokes the Worker's `scheduled` handler,
# which deletes sessions idle beyond the retention window (see worker.ts).
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------------------
# D1 session persistence
#
# Production database: lbv-sales-sessions (binding "DB").
# The id below is the real production database id (a resource identifier, not a
# secret). `npm run check:deploy` still fails if a placeholder id is ever
# reintroduced. See DEPLOYMENT.md section 5 for the migration sequence.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "lbv-sales-sessions"
database_id = "b1e94824-0128-4b48-9b88-89827a126acb"
migrations_dir = "migrations"
