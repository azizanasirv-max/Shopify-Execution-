name: CI

# Repository checks only. This workflow NEVER deploys and never uses real secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, tests, build, wrangler dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Deterministic test suite (offline)
        # The deterministic suites (hardening, isolation, approval-gate, worker,
        # d1, persistence, realtime, llm, service) run fully offline and do not
        # require a real API key. A dummy value is provided only so any legacy
        # assumption is satisfied; it is never a real secret.
        env:
          GEMINI_API_KEY: dummy
        run: npm test

      - name: Production build
        run: npm run build

      - name: Wrangler deployment dry-run
        # Bundles worker.ts and reads ./dist assets. Uploads nothing.
        # The D1 database_id placeholder is intentionally still present here;
        # real deployments are guarded by `npm run check:deploy`.
        run: npx --yes wrangler@4 deploy --dry-run
